[package]
name = "delve"
version = "0.7.0"
edition = "2021"
description = "A terminal roguelike — descend 5 dungeon floors, claim the Crown of Depth, and return to the surface."
license = "MIT"
repository = "https://github.com/wheevu/delve"
readme = "README.md"
rust-version = "1.86"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rand = "0.8"
rand_chacha = "0.3"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.30"
simplelog = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
